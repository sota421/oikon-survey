<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生プロジェクト 4年生 追いコンのご案内</title>
  <!-- LINE などにリンクを貼ったときのプレビュー（タイトルと説明文） -->
  <meta property="og:title" content="学生プロジェクト 4年生 追いコンのご案内">
  <meta property="og:description" content="参加希望と日程の調整のため、ご回答をお願いします。">
  <meta property="og:type" content="website">
  <meta name="description" content="参加希望と日程の調整のため、ご回答をお願いします。">
  <!--
    ファイル名の後ろの ?v=… は「版番号」。
    style.css や script.js を更新したら、この数字を1つ増やして index.html も一緒にアップロードすると、
    スマホに古いファイルが残っていても必ず新しいほうが読み込まれる。
  -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <!-- 画面はすべて script.js がここに描画する（#/edit/ID などのハッシュで切り替え） -->
  <div id="app"></div>

  <!-- 画面下に出る小さな通知 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=4"></script>
  <script src="datepicker.js?v=4"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
